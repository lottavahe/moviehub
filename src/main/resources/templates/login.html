<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Moviehub Log In </title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-beige">

    <div class="col-md-4 offset-md-4 mt-5">
        <div class="card shadow-sm p-4">
            <h2 class="mb-3 text-center">MovieHub</h2>
            <p class="text-center text-muted">Log in to your movie and series tracker.</p>

            <div class="alert alert-danger" th:if="${param.error}">
                Invalid username and password.
            </div>
            <div class="alert alert-warning" th:if="${param.logout}">
                You have been logged out.
            </div>
            <div class="alert alert-success" th:if="${param.registered}">
                Registration successful. You can now log in.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label> User Name : <input type="text" name="username" class="form-control" /> </label>
                </div>
                <div class="mb-3">
                    <label> Password: <input type="password" name="password" class="form-control" /> </label>
                </div>
                <div class="mt-3">
                    <input type="submit" value="Sign In" class="btn btn-primary" />
                </div>
            </form>

            <div class="mt-3">
                <p>Dont have an account?</p>
                <a th:href="@{/register}">Register here</a>
                <p>Forgot your password?</p>
                <a th:href="@{/forgotpassword}">Reset password here</a>
            </div>
        </div>
    </div>
</body>

</html>
