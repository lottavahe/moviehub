<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <title>Watched</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <div class="mb-5">
            <h1 class="page-title">Watched</h1>
            <p class="page-subtitle mb-0">Movies and series you have already watched</p>
        </div>

        <div class="mb-5">
            <h2 class="mb-4">Movies</h2>

            <div class="row g-4">
                <div class="col-sm-6 col-md-4 col-lg-3" th:each="movie : ${watchedMovies}">
                    <div class="card movie-card h-100">
                        <div class="movie-poster-placeholder">
                            <span th:text="${movie.title}">Movie title</span>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${movie.title}">Title</h5>
                            <p class="card-text mb-1">
                                <strong>Director:</strong>
                                <span th:text="${movie.director}"></span>
                            </p>
                            <p class="card-text mb-1">
                                <strong>Year:</strong>
                                <span th:text="${movie.releaseYear}"></span>
                            </p>
                            <p class="card-text mb-1">
                                <strong>Duration:</strong>
                                <span th:text="${movie.duration}"></span>
                            </p>
                            <p class="card-text mb-3">
                                <strong>Genre:</strong>
                                <span th:text="${movie.genre.genreName}"></span>
                            </p>

                            <div class="mt-auto d-grid">
                                <a class="btn btn-outline-dark" th:href="@{/returnmovietomovies/{id}(id=${movie.id})}">
                                    Remove from watched
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(watchedMovies)}" class="col-12">
                    <p class="text-muted">No watched movies yet.</p>
                </div>
            </div>
        </div>

        <div>
            <h2 class="mb-4">Series</h2>

            <div class="row g-4">
                <div class="col-sm-6 col-md-4 col-lg-3" th:each="serie : ${watchedSeries}">
                    <div class="card movie-card h-100">
                        <div class="movie-poster-placeholder">
                            <span th:text="${serie.title}">Series title</span>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${serie.title}">Title</h5>
                            <p class="card-text mb-1">
                                <strong>Creator:</strong>
                                <span th:text="${serie.creator}"></span>
                            </p>
                            <p class="card-text mb-1">
                                <strong>Year:</strong>
                                <span th:text="${serie.releaseYear}"></span>
                            </p>
                            <p class="card-text mb-1">
                                <strong>Seasons:</strong>
                                <span th:text="${serie.seasons}"></span>
                            </p>
                            <p class="card-text mb-1">
                                <strong>Episodes:</strong>
                                <span th:text="${serie.episodes}"></span>
                            </p>
                            <p class="card-text mb-1">
                                <strong>Episode duration:</strong>
                                <span th:text="${serie.duration}"></span>
                            </p>
                            <p class="card-text mb-3">
                                <strong>Genre:</strong>
                                <span th:text="${serie.genre.genreName}"></span>
                            </p>

                            <div class="mt-auto d-grid">
                                <a class="btn btn-outline-dark" th:href="@{/returnserietoseries/{id}(id=${serie.id})}">
                                    Remove from watched
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(watchedSeries)}" class="col-12">
                    <p class="text-muted">No watched series yet.</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
