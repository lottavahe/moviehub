<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Token Error</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-beige">

    <div class="col-md-4 offset-md-4 mt-5">
        <div class="card shadow-sm p-4 text-center">
            <h2 class="mb-3">MovieHub</h2>
            <p class="text-danger fw-bold">Oops! Your link is invalid or has expired.</p>
            <p class="text-muted">Please request a new password reset link and try again.</p>

            <div class="mt-3">
                <a th:href="@{/forgotpassword}" class="btn btn-primary">Request new link</a>
            </div>

            <div class="mt-3">
                <a th:href="@{/login}">Back to login</a>
            </div>
        </div>
    </div>

</body>
</html>
