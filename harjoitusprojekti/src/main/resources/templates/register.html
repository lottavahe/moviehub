<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Moviehub Register</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-beige">
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="col-md-4">
            <div class="card shadow-sm p-4">
                <h2 class="mb-3 text-center">Create account</h2>
                <p class="text-muted text-center">Register to MovieHub and start using the application.</p>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <form th:action="@{/register}" th:object="${registerForm}" method="post">
                    <div class="form-group mb-3">
                        <label>Username</label>
                        <input type="text" th:field="*{username}" class="form-control" required />
                    </div>

                    <div class="form-group mb-3">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required />
                    </div>

                    <div class="form-group mb-3">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" class="form-control" required />
                    </div>
                    <div class="form-group mb-3">
                        <label>Confirm password</label>
                        <input type="password" th:field="*{confirmPassword}" class="form-control" required />
                    </div>

                    <div style="margin-top: 10px;" class="d-flex gap-2">
                        <input type="submit" value="Register" class="btn btn-success" />
                        <a th:href="@{/login}" class="btn btn-link">Back to login</a>
                    </div>
                </form>

                <div class="mt-3">
                    <p class="mb-1">Allready have an account?</p>
                    <li><a th:href="@{/login}">Login here</a></li>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
